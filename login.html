<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | Học nhóm Năm 2 Khoa Toán</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="TRANGWEB/styleweb.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center vh-100 bg-light" style="background: url('https://drive.google.com/thumbnail?id=1iibBgIr9XoEcOXusF-ckVA-SBPlR_tai&sz=w1920') center/cover no-repeat !important;">

    <div class="card border-0 shadow-lg auth-modal-content" style="max-width: 450px; width: 100%; border-radius: 24px; overflow: hidden;">
        <div class="auth-header text-center p-4 text-white" style="background: linear-gradient(135deg, rgba(15, 76, 129, 0.85), rgba(32, 113, 179, 0.85));">
            <div class="auth-header-icon fs-1 mb-2"><i class="fa-solid fa-graduation-cap"></i></div>
            <h4 class="fw-bold mb-1">Cổng Sinh Viên</h4>
            <p class="mb-0 small opacity-90">Đăng nhập để tiếp tục vào hệ thống</p>
        </div>
        <div class="card-body p-4 p-sm-5">
            <!-- Nơi hiển thị tài khoản đã lưu gần đây -->
            <div id="savedAccountsContainer" class="mb-3"></div>

            <div class="input-icon-wrapper mb-3">
                <input type="text" id="txtUserMSSV" class="form-control" placeholder="Mã số sinh viên (VD: 51.01.101.000)">
                <i class="fa-solid fa-id-card"></i>
            </div>
            <div class="input-icon-wrapper mb-3">
                <input type="password" id="txtUserPass" class="form-control" placeholder="Mật khẩu (Mặc định: 123)">
                <i class="fa-solid fa-lock"></i>
            </div>
            <small class="text-danger text-center d-block d-none mb-3 fw-bold" id="userAuthError"></small>
            
            <button type="button" class="btn btn-primary w-100 btn-auth" onclick="loginStudentPage()" id="btnLoginStudent">
                Đăng nhập ngay
            </button>
        </div>
    </div>

    <!-- Thư viện cần thiết -->
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="TRANGWEB/config.js"></script>
    <script src="TRANGWEB/Xulyxacthuc.js"></script>
    <script>
        // Hàm xử lý riêng cho trang Login độc lập
        $(document).ready(function() {
            renderSavedAccounts();
        });

        function loginStudentPage() {
            let mssv = $('#txtUserMSSV').val().trim(); 
            let pass = $('#txtUserPass').val().trim();
            
            if (!mssv || !pass) { 
                $('#userAuthError').removeClass('d-none').text("Vui lòng nhập đầy đủ thông tin!"); 
                return; 
            }

            let btn = $('#btnLoginStudent'); 
            btn.html('<i class="fa-solid fa-spinner fa-spin me-2"></i>Đang xử lý...').prop('disabled', true);
            
            postToGAS({ action: "login", mssv: mssv, password: pass }, function(res) {
                let response = typeof res === 'string' ? JSON.parse(res) : res;
                if (response.success) {
                    let currentUser = { 
                        mssv: response.mssv, 
                        name: response.name,
                        chuyenNganh: response.chuyenNganh,
                        khoa: response.khoa,
                        khoaHoc: response.khoaHoc,
                        nhom: response.nhom
                    };
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    
                    let savedAccounts = JSON.parse(localStorage.getItem('savedAccounts')) || [];
                    savedAccounts = savedAccounts.filter(acc => acc.mssv !== response.mssv);
                    savedAccounts.unshift({ mssv: response.mssv, name: response.name });
                    if (savedAccounts.length > 3) savedAccounts.pop(); 
                    localStorage.setItem('savedAccounts', JSON.stringify(savedAccounts));

                    // Đăng nhập thành công -> Chuyển hướng về trang chủ chính (index.html)
                    window.location.href = "hocnhomnam2khoatoan.html";
                } else { 
                    $('#userAuthError').removeClass('d-none').text(response.message); 
                    btn.html('Đăng nhập ngay').prop('disabled', false); 
                }
            }, function() { 
                $('#userAuthError').removeClass('d-none').text("Lỗi kết nối!"); 
                btn.html('Đăng nhập ngay').prop('disabled', false); 
            });
        }
    </script>
</body>
</html>

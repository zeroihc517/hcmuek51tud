    <style>
        :root {
            --primary-navy: #0f4c81;
            --primary-blue: #154c79;
            --accent-emerald: #10b981;
            --accent-cyan: #0ea5e9;
            --bg-page: #f0f4f8;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-light: #e2e8f0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-page);
            background-image: 
                radial-gradient(at 0% 0%, rgba(14, 165, 233, 0.06) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(16, 185, 129, 0.06) 0px, transparent 50%);
            color: var(--text-dark);
            padding-bottom: 50px;
            overflow-x: hidden;
        }

        /* =========================================================
           1. HIỆU ỨNG INTRO AURORA & LƯỚI TỌA ĐỘ GIỐNG WEB APMA
           ========================================================= */
        #apmaIntroOverlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 35%, #ffffff 0%, #e0f2fe 45%, #ede9fe 80%, #fce7f3 100%);
            background-size: 200% 200%;
            animation: auroraShift 4s ease-in-out infinite alternate;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.45s;
        }

        #apmaIntroOverlay.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        @keyframes auroraShift {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        .blueprint-bg {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(15, 76, 129, 0.07) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(16, 185, 129, 0.07) 1px, transparent 1px);
            background-size: 36px 36px;
            mask-image: radial-gradient(circle at 50% 45%, black 35%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at 50% 45%, black 35%, transparent 80%);
            pointer-events: none;
        }

        .intro-holo-box {
            position: relative;
            z-index: 2;
            padding: 3px;
            border-radius: 22px;
            background: linear-gradient(120deg, #0f4c81, #0ea5e9, #10b981, #6366f1, #0f4c81);
            background-size: 300% 300%;
            animation: holoFlow 3s linear infinite;
            box-shadow: 0 20px 45px -10px rgba(15, 76, 129, 0.25);
            max-width: 90vw;
            width: 440px;
        }

        @keyframes holoFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .intro-holo-inner {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(18px);
            border-radius: 19px;
            padding: 26px 28px;
            text-align: center;
        }

        .intro-hexagon-badge {
            width: 64px;
            height: 64px;
            margin: 0 auto 14px auto;
            border-radius: 18px;
            background: linear-gradient(135deg, #0f4c81, #10b981);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 10px 22px rgba(15, 76, 129, 0.28);
            animation: pulseFloat 1.6s ease-in-out infinite;
        }

        @keyframes pulseFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-5px) scale(1.05); }
        }

        .intro-title {
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 800;
            font-size: 1.35rem;
            background: linear-gradient(90deg, #0f4c81, #0284c7, #059669);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .intro-bar-track {
            width: 100%;
            height: 7px;
            background: #e2e8f0;
            border-radius: 99px;
            overflow: hidden;
            margin-top: 16px;
        }

        .intro-bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 99px;
            background: linear-gradient(90deg, #0f4c81, #0ea5e9, #10b981);
            animation: fillFast 1.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes fillFast {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* =========================================================
           2. HEADER KÍNH MỜ (GLASSMORPHISM) & BỘ LỌC GỌN ĐẸP
           ========================================================= */
        .directory-header {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(203, 213, 225, 0.8);
            padding: 14px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(15, 76, 129, 0.05);
        }

        .search-box-wrap {
            position: relative;
        }
        .search-box-wrap i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-navy);
            font-size: 14px;
        }
        .search-box-wrap input {
            padding-left: 40px;
            height: 40px;
            border-radius: 50px;
            border: 1.5px solid #cbd5e1;
            background: #f8fafc;
            font-size: 13.5px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .search-box-wrap input:focus {
            background: #ffffff;
            border-color: var(--primary-navy);
            box-shadow: 0 0 0 3px rgba(15, 76, 129, 0.12);
        }

        .filter-pills {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 2px;
        }
        .filter-pills::-webkit-scrollbar { height: 3px; }
        .filter-pills::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .btn-filter-cat {
            border-radius: 50px;
            padding: 6px 14px;
            font-size: 12.5px;
            font-weight: 700;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #475569;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .btn-filter-cat:hover {
            background: #e0f2fe;
            color: var(--primary-navy);
            border-color: #7dd3fc;
        }
        .btn-filter-cat.active {
            background: linear-gradient(135deg, #0f4c81, #155e95);
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 4px 10px rgba(15, 76, 129, 0.22);
        }

        /* Tiêu đề nhóm */
        .group-heading {
            font-size: 14px;
            font-weight: 800;
            color: var(--primary-navy);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 22px 0 12px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .group-heading::after {
            content: "";
            flex: 1;
            height: 1.5px;
            background: linear-gradient(90deg, #cbd5e1, transparent);
        }

        /* =========================================================
           3. THẺ PHÒNG BAN SIÊU GỌN (3 - 4 THẺ / HÀNG) & HIỆU ỨNG XUẤT HIỆN
           ========================================================= */
        @keyframes cardPopUp {
            0% { opacity: 0; transform: translateY(14px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .dept-col {
            animation: cardPopUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .dept-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-top: 3.5px solid var(--primary-navy);
            border-radius: 14px;
            padding: 14px 16px;
            height: 100%;
            box-shadow: 0 3px 12px rgba(15, 23, 42, 0.035);
            transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .dept-card.cat-center {
            border-top-color: var(--accent-emerald);
        }

        .dept-card.cat-faculty {
            border-top-color: var(--accent-cyan);
        }

        .dept-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(15, 76, 129, 0.11);
            border-color: #93c5fd;
        }

        .dept-title {
            font-size: 14.5px;
            font-weight: 800;
            color: #0f172a;
            line-height: 1.35;
            margin-bottom: 3px;
        }

        .dept-subtitle {
            font-size: 11.5px;
            color: var(--text-muted);
            font-weight: 500;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .info-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 7px;
            font-size: 12.8px;
            line-height: 1.4;
            color: #1e293b;
        }
        .info-row i.row-icon {
            color: var(--primary-navy);
            width: 14px;
            text-align: center;
            font-size: 12.5px;
            margin-top: 3px;
            flex-shrink: 0;
        }

        /* Nút Copy Gọn */
        .copyable-text {
            cursor: pointer;
            padding: 1px 5px;
            margin: -1px -5px;
            border-radius: 5px;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            word-break: break-word;
        }
        .copyable-text:hover {
            background-color: #e0f2fe;
            color: #0369a1;
        }
        .copy-hint-icon {
            font-size: 10.5px;
            color: #94a3b8;
            opacity: 0;
            transition: opacity 0.15s;
        }
        .copyable-text:hover .copy-hint-icon {
            opacity: 1;
            color: #0369a1;
        }

        /* Pill Số nhánh nhỏ gọn */
        .ext-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #eff6ff;
            color: #1d4ed8;
            border: 1px solid #bfdbfe;
            font-weight: 700;
            font-size: 11.5px;
            padding: 1px 7px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.15s;
            user-select: none;
        }
        .ext-pill:hover {
            background-color: #0f4c81;
            color: #ffffff;
            border-color: #0f4c81;
            transform: scale(1.06);
        }

        .btn-copy-all {
            width: 26px;
            height: 26px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 7px;
            font-size: 11.5px;
            color: #64748b;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            transition: all 0.15s;
        }
        .btn-copy-all:hover {
            background: #0f4c81;
            color: #ffffff;
            border-color: #0f4c81;
        }

        /* Nút xổ Chức năng chính */
        .btn-func-toggle {
            background: none;
            border: none;
            padding: 4px 0 0 0;
            margin-top: auto;
            font-size: 12px;
            font-weight: 700;
            color: #0f4c81;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            width: fit-content;
            transition: color 0.2s;
        }
        .btn-func-toggle:hover {
            color: #059669;
        }
        .btn-func-toggle i {
            transition: transform 0.25s ease;
            font-size: 10.5px;
        }
        .btn-func-toggle[aria-expanded="true"] i {
            transform: rotate(180deg);
        }

        .func-box {
            margin-top: 8px;
            padding: 9px 11px;
            background: #f8fafc;
            border-radius: 8px;
            border-left: 3px solid var(--accent-emerald);
            font-size: 12px;
            color: #334155;
            line-height: 1.5;
        }
        .func-box ul {
            margin: 0;
            padding-left: 15px;
        }

        /* Toast thông báo Copy */
        .copy-toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #0f172a;
            color: #ffffff;
            padding: 9px 16px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.22);
            z-index: 9999;
            opacity: 0;
            transform: translateY(15px);
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .copy-toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>

        let activeCategory = 'all';
        let toastTimeout = null;

        // Tắt hiệu ứng Intro mượt mà sau 1.4s
        window.addEventListener('DOMContentLoaded', () => {
            filterDepartments();
            setTimeout(() => {
                const intro = document.getElementById('apmaIntroOverlay');
                if (intro) intro.classList.add('fade-out');
            }, 1350);
        });

        function copyText(text, label) {
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById('copyToast');
                const toastText = document.getElementById('copyToastText');
                toastText.innerHTML = `Đã sao chép ${label}: <strong>${text}</strong>`;
                toast.classList.add('show');

                if (toastTimeout) clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, 2200);
            }).catch(() => {
                alert("Đã sao chép: " + text);
            });
        }

        function selectCategory(cat, btn) {
            activeCategory = cat;
            document.querySelectorAll('.btn-filter-cat').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filterDepartments();
        }

        function filterDepartments() {
            const keyword = document.getElementById('searchDeptInput').value.toLowerCase().trim();
            const container = document.getElementById('directoryContainer');

            const filtered = DEPARTMENT_DATA.filter(dept => {
                const matchCat = (activeCategory === 'all') || (dept.category === activeCategory);
                const phoneStr = dept.phones.map(p => `${p.number} ${p.extensions.join(' ')}`).join(' ');
                const fullText = `${dept.name} ${dept.tags} ${dept.address} ${phoneStr} ${dept.emails.join(' ')} ${dept.website} ${dept.functions.join(' ')}`.toLowerCase();
                const matchKey = !keyword || fullText.includes(keyword);
                return matchCat && matchKey;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-5 my-4 bg-white rounded-4 border">
                        <i class="fa-regular fa-folder-open fs-1 text-muted mb-3"></i>
                        <h6 class="fw-bold text-secondary">Không tìm thấy đơn vị phù hợp</h6>
                        <p class="text-muted small m-0">Thử tìm với từ khóa khác (ví dụ: Toán, Đào tạo, 141, học phí, BHYT...).</p>
                    </div>`;
                return;
            }

            const grouped = {};
            filtered.forEach(item => {
                if (!grouped[item.category]) grouped[item.category] = [];
                grouped[item.category].push(item);
            });

            let html = '';
            let cardUid = 0;

            for (const [catName, items] of Object.entries(grouped)) {
                let borderClass = '';
                if (catName.includes('Trung tâm')) borderClass = 'cat-center';
                else if (catName.includes('Khoa')) borderClass = 'cat-faculty';

                html += `<div class="group-heading"><i class="fa-solid fa-building-columns"></i> ${catName} <span class="badge bg-primary-subtle text-primary rounded-pill ms-1" style="font-size:11.5px;">${items.length}</span></div>`;
                // Chia lưới 1 cột mobile, 2 cột tablet, 3 cột laptop, 4 cột màn hình rộng (xl)
                html += `<div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-3">`;

                items.forEach((dept, idx) => {
                    cardUid++;
                    const collapseId = `funcCollapse_${cardUid}`;
                    const animDelay = Math.min(idx * 0.03, 0.45);

                    const phonesHtml = dept.phones.map(p => {
                        const copyPhoneVal = p.rawCopy || p.number;
                        const extHtml = p.extensions && p.extensions.length > 0
                            ? `<span class="text-muted" style="font-size:11.5px;">· Nhánh</span> ` + p.extensions.map(ext =>
                                `<span class="ext-pill" title="Bấm sao chép ${copyPhoneVal} - Nhánh ${ext}" onclick="copyText('${copyPhoneVal} - Nhánh ${ext}', 'SĐT & Nhánh')">${ext}</span>`
                              ).join(' ')
                            : '';

                        return `
                        <div class="info-row">
                            <i class="fa-solid fa-phone row-icon"></i>
                            <div class="d-flex align-items-center flex-wrap gap-1">
                                <span class="copyable-text fw-semibold" title="Bấm sao chép SĐT" onclick="copyText('${copyPhoneVal}', 'Số điện thoại')">
                                    ${p.number} <i class="fa-regular fa-copy copy-hint-icon"></i>
                                </span>
                                ${extHtml}
                            </div>
                        </div>`;
                    }).join('');

                    const emailsHtml = dept.emails.map(em => `
                        <span class="copyable-text" title="Bấm sao chép Email" onclick="copyText('${em}', 'Email')">
                            ${em} <i class="fa-regular fa-copy copy-hint-icon"></i>
                        </span>
                    `).join('');

                    const websiteHtml = dept.website ? `
                        <div class="info-row">
                            <i class="fa-solid fa-globe row-icon"></i>
                            <a href="${dept.website}" target="_blank" class="text-decoration-none fw-semibold text-truncate" style="color: #0284c7; max-width: 85%;">
                                ${dept.website.replace(/^https?:\/\//, '')} <i class="fa-solid fa-arrow-up-right-from-square ms-1" style="font-size: 10px;"></i>
                            </a>
                        </div>` : '';

                    const allPhonesSummary = dept.phones.map(p => `${p.number}${p.extensions.length ? ' (Nhánh ' + p.extensions.join(', ') + ')' : ''}`).join(' | ');
                    const fullCopySummary = `${dept.name}\nĐịa chỉ: ${dept.address}\nSĐT: ${allPhonesSummary}\nEmail: ${dept.emails.join(', ')}`;

                    const funcListHtml = dept.functions.map(f => `<li>${f}</li>`).join('');

                    html += `
                    <div class="col dept-col" style="animation-delay: ${animDelay}s;">
                        <div class="dept-card ${borderClass}">
                            <div class="d-flex justify-content-between align-items-start gap-2">
                                <div style="min-width: 0;">
                                    <div class="dept-title">${dept.name}</div>
                                    <div class="dept-subtitle" title="${dept.tags}">${dept.tags}</div>
                                </div>
                                <button class="btn-copy-all flex-shrink-0" title="Sao chép trọn bộ thông tin" onclick="copyText('${fullCopySummary}', 'thông tin ${dept.name}')">
                                    <i class="fa-regular fa-copy"></i>
                                </button>
                            </div>

                            <!-- Địa chỉ -->
                            <div class="info-row">
                                <i class="fa-solid fa-location-dot row-icon"></i>
                                <span class="copyable-text" title="Bấm sao chép địa chỉ" onclick="copyText('${dept.address}', 'Địa chỉ')">
                                    ${dept.address} <i class="fa-regular fa-copy copy-hint-icon"></i>
                                </span>
                            </div>

                            <!-- Điện thoại & Nhánh -->
                            ${phonesHtml}

                            <!-- Email -->
                            <div class="info-row">
                                <i class="fa-regular fa-envelope row-icon"></i>
                                <div class="d-flex flex-column gap-1">${emailsHtml}</div>
                            </div>

                            <!-- Website -->
                            ${websiteHtml}

                            <!-- Chức năng chính -->
                            <button class="btn-func-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#${collapseId}" aria-expanded="false">
                                Chức năng chính <i class="fa-solid fa-chevron-down"></i>
                            </button>
                            <div class="collapse" id="${collapseId}">
                                <div class="func-box">
                                    <ul>${funcListHtml}</ul>
                                </div>
                            </div>
                        </div>
                    </div>`;
                });

                html += `</div>`;
            }

            container.innerHTML = html;
        }
    </script>

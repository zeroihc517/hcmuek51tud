<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Làm bài tập Lý thuyết & Lập trình | Học nhóm APMA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Đường dẫn CSS lùi 2 cấp thư mục -->
    <link href="../../TRANGWEB/styleweb.css" rel="stylesheet">
    <link href="../Cấu trúc dữ liệu/baitap.css" rel="stylesheet">

</head>
<body style="background-color: #f8fafc; font-family: 'Inter', sans-serif;">

    <div class="container-fluid px-3 px-md-5 py-4">
        
       <!-- GỘP CHUNG: HEADER BÀI TẬP & DANH SÁCH CÂU HỎI -->
        <div class="card border-0 shadow-sm mb-4" style="border-radius: 16px; border-left: 6px solid #0f4c81 !important; background: #ffffff;">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-3 pb-3 border-bottom">
                    <div>
                        <span class="badge bg-primary mb-2 px-3 py-1.5" style="font-size: 13px; background-color: #0f4c81 !important;" id="badgeCourse">Đang tải học phần...</span>
                        <h3 class="fw-bold text-dark m-0" id="titleMaBai">Bài tập: ---</h3>
                    </div>
                </div>

                <div>
                    <div class="d-flex align-items-center justify-content-between mb-2">
                        <span class="fw-bold text-uppercase small text-muted" style="letter-spacing: 0.5px;">
                            <i class="fa-solid fa-layer-group text-primary me-1"></i> Danh sách câu hỏi:
                        </span>
                        <span class="badge bg-light text-dark border fw-normal" id="labelTotalQuestions">0 câu</span>
                    </div>
                    <div class="question-nav-container" id="questionTabsContainer"></div>
                </div>
            </div>
        </div>

        <!-- BỐ CỤC CHÍNH: 1/3 TRÁI (ĐỀ BÀI) & 2/3 PHẢI (BÀI LÀM) -->
        <div class="row g-4 mb-4">
            <!-- 1/3 CỘT TRÁI: Khung hiển thị Đề bài chi tiết -->
            <div class="col-lg-5">
                <div class="card border-0 shadow-sm h-100" style="border-radius: 16px; background-color: #ffffff;">
                    <div class="card-header bg-light border-0 pt-3 px-4 d-flex align-items-center justify-content-between">
                        <h6 class="fw-bold text-primary m-0"><i class="fa-solid fa-circle-question me-2"></i>Đề bài chi tiết</h6>
                        <span class="badge bg-danger px-3 py-1" id="labelCurrentMaBai" style="font-size: 12px;">Mã bài: ---</span>
                    </div>
                    <div class="card-body p-4 fs-6 text-secondary" id="questionContentArea" style="line-height: 1.6;">
                        Đang tải đề bài...
                    </div>
                </div>
            </div>

            <!-- 2/3 CỘT PHẢI: Khung Soạn thảo Lý thuyết & Mã nguồn Code (Có hỗ trợ ẩn/hiện khung code) -->
            <div class="col-lg-7">
                <div class="card border-0 shadow-sm h-100" style="border-radius: 16px; overflow: hidden;" id="mainSubmissionCard">
                    <div class="card-header text-white d-flex justify-content-between align-items-center py-3 px-4" style="background-color: #0f4c81;">
                        <h6 class="m-0 fw-bold" id="formSubmissionTitle"><i class="fa-solid fa-pen-to-square me-2"></i>Bài làm của sinh viên</h6>
                        <div class="d-flex align-items-center gap-2">
                            <span class="small opacity-75">MSSV:</span>
                            <input type="text" id="txtExerciseMSSV" class="form-control form-control-sm fw-bold border-0 text-center" style="width: 120px; background: rgba(255,255,255,0.2); color: #fff;" readonly>
                        </div>
                    </div>
<div class="mb-2">
    <button type="button" class="btn btn-sm btn-outline-secondary fw-bold" onclick="toggleDrawingTool()">
        <i class="fa-solid fa-pencil text-primary me-1"></i> Bật bảng vẽ phác thảo (Bút chì)
    </button>
</div>
<div id="drawingContainer" class="card p-3 mb-3 d-none border bg-light">
    <div class="d-flex justify-content-between align-items-center mb-2">
        <span class="fw-bold small text-dark"><i class="fa-solid fa-paintbrush me-1"></i> Bảng vẽ phác thảo tự do:</span>
        <div class="d-flex gap-2">
            <button type="button" class="btn btn-sm btn-outline-danger" onclick="clearCanvas()">Xóa sạch</button>
            <button type="button" class="btn btn-sm btn-primary" onclick="insertDrawingToEditor()">Chèn vào bài làm</button>
        </div>
    </div>
    <canvas id="sketchCanvas" width="600" height="250" class="w-100 bg-white border rounded shadow-sm" style="cursor: crosshair;"></canvas>
</div>
                    <div class="card-body p-4 d-flex flex-column justify-content-between">
                        <div>
                            <!-- 1. SOẠN THẢO LÝ THUYẾT -->
                            <div class="mb-4">
                                <label class="form-label fw-bold text-dark" style="font-size: 15px;">
                                    <i class="fa-solid fa-align-left text-primary me-2"></i>1. TRẢ LỜI / LỜI GIẢI LÝ THUYẾT:
                                </label>
                                <textarea id="theoryEditor" class="form-control" rows="6" placeholder="Trình bày lời giải hoặc câu trả lời lý thuyết..."></textarea>
                            </div>

                            <!-- 2. KHUNG CODE (TỰ ĐỘNG HIỆN/ẨN TÙY THUỘC VÀO CÂU HỎI) -->
                            <div class="mb-4" id="codeSectionWrapper">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <label class="form-label fw-bold text-dark m-0" style="font-size: 15px;">
                                        <i class="fa-solid fa-code text-success me-2"></i>2. MÃ NGUỒN CHƯƠNG TRÌNH (CODE):
                                    </label>
                                    <div class="d-flex align-items-center gap-2">
                                        <span class="small text-muted">Ngôn ngữ:</span>
                                        <select id="selectLang" class="form-select form-select-sm fw-bold" style="width: 120px;" onchange="changeEditorLang()">
                                            <option value="cpp">C / C++</option>
                                            <option value="python">Python</option>
                                        </select>
                                    </div>
                                </div>
                                <div id="exerciseCodeEditor" style="height: 320px; border: 1px solid #cbd5e1; border-radius: 8px;"></div>
                            </div>
                        </div>

                        <!-- NÚT NỘP BÀI -->
                        <div class="d-flex justify-content-between align-items-center pt-3 border-top mt-auto">
                            <div class="d-flex align-items-center gap-2">
                                <span class="text-muted small"><i class="fa-solid fa-circle-info me-1"></i>Bài làm sẽ được lưu trực tiếp vào Thảo luận.</span>
                                <button type="button" class="btn btn-sm btn-outline-danger fw-bold d-none" id="btnCancelEditMode" onclick="cancelEditMode()">
                                    <i class="fa-solid fa-xmark me-1"></i> Hủy sửa
                                </button>
                            </div>
                            <button type="button" class="btn text-white fw-bold px-5 py-2.5 shadow-sm" style="background-color: #0f4c81; border-radius: 12px; font-size: 15px;" onclick="submitExerciseSolution()" id="btnSubmitExercise">
                                <i class="fa-solid fa-paper-plane me-2"></i> Nộp bài & Đăng lên Thảo luận
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- MỤC LỊCH SỬ BÀI NỘP CỦA TÔI -->
        <div class="card border-0 shadow-sm" style="border-radius: 16px; background-color: #ffffff;">
            <div class="card-header bg-light border-0 pt-3 px-4 d-flex align-items-center justify-content-between">
                <h6 class="fw-bold text-success m-0"><i class="fa-solid fa-clock-rotate-left me-2"></i>Lịch sử bài nộp của tôi</h6>
                <button class="btn btn-sm btn-outline-success fw-bold" onclick="loadSubmissionHistory()" style="border-radius: 8px;">
                    <i class="fa-solid fa-rotate-right me-1"></i> Làm mới lịch sử
                </button>
            </div>
            <div class="card-body p-4" id="submissionHistoryContainer">
                <div class="text-center text-muted py-3">
                    <i class="fa-solid fa-spinner fa-spin me-2"></i> Đang tải lịch sử bài nộp...
                </div>
            </div>
        </div>

    </div>

    <!-- Thư viện JS -->
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tinymce/6.8.2/tinymce.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.36.2/ace.js"></script>
    <!-- Đường dẫn JS config lùi 2 cấp thư mục -->
    <script src="../../TRANGWEB/config.js"></script>

<script>
        window.FILTER_TITLE_KEYWORD = "Khuôn hình";
        window.EXERCISE_COURSE_NAME = "Lập trình hướng đối tượng";
    </script>
    
    <!-- File JS dùng chung cho tất cả các trang bài tập -->
    <script src="../Cấu trúc dữ liệu/baitap.js"></script>
<!-- Thêm MathJax để đọc công thức LaTeX $n$, \(...\) -->
<script>
    window.MathJax = {
        tex: {
            inlineMath: [['$', '$'], ['\\(', '\\)']],
            displayMath: [['$$', '$$'], ['\\[', '\\]']]
        }
    };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<script src="../../TRANGWEB/qa.js"></script>
</body>
</html>

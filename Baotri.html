<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bảo trì hệ thống</title>
  <style>
    :root{
      --bg: #0f172a;        /* slate-900 */
      --card: #111827;      /* gray-900 */
      --text: #e5e7eb;      /* gray-200 */
      --muted:#9ca3af;      /* gray-400 */
      --accent:#38bdf8;     /* sky-400 */
      --ring:#1f2937;       /* gray-800 */
    }
    @media (prefers-color-scheme: light){
      :root{
        --bg:#f1f5f9;       /* slate-100 */
        --card:#ffffff;
        --text:#0f172a;
        --muted:#475569;
        --accent:#0284c7;   /* sky-600 */
        --ring:#e5e7eb;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body{
      margin:0;
      background: radial-gradient(1200px 800px at 50% -10%, rgba(56,189,248,.18), transparent 60%) , var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display:flex; align-items:center; justify-content:center;
      padding: 24px;
    }
    .card{
      width: 100%;
      max-width: 620px;
      background: var(--card);
      border: 1px solid var(--ring);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
      padding: 32px 28px;
      text-align: center;
    }
    .icon{
      width: 84px; height: 84px; margin: 0 auto 16px;
      display:block;
      filter: drop-shadow(0 6px 16px rgba(2,132,199,.25));
    }
    .gear{ transform-origin: 50% 50%; animation: slowspin 8s linear infinite; }
    @keyframes slowspin{ to{ transform: rotate(360deg);} }
    h1{
      font-size: clamp(22px, 3.4vw, 28px);
      margin: 0 0 10px;
      letter-spacing: .2px;
    }
    p{
      color: var(--muted);
      margin: 0;
      font-size: clamp(14px, 2.4vw, 16px);
      line-height: 1.6;
    }
    .time-badge{
      display: inline-block;
      margin: 16px 0 10px;
      padding: 8px 18px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px dashed var(--accent);
      border-radius: 50px;
      color: var(--accent);
      font-weight: 700;
      font-size: 15px;
    }
    .countdown-text{
      display: block;
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 8px;
    }
    .btn{
      margin-top: 14px;
      display:inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      border-radius: 12px;
      border: 1px solid var(--accent);
      background: linear-gradient(180deg, rgba(56,189,248,.18), rgba(56,189,248,.08));
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover{
      background: rgba(56,189,248,.25);
      transform: translateY(-1px);
    }
    .tips{
      margin-top: 20px;
      font-size: 13px;
      color: var(--muted);
      opacity: .85;
    }
  </style>
</head>
<body>
  <main class="card" role="main" aria-labelledby="maintitle">
    <svg class="icon" viewBox="0 0 128 128" aria-hidden="true">
      <circle cx="64" cy="64" r="48" fill="rgba(56,189,248,.10)" stroke="var(--accent)" stroke-width="2"/>
      <g class="gear" fill="none" stroke="var(--accent)" stroke-width="4">
        <circle cx="64" cy="64" r="16"/>
        <g>
          <path d="M64 34 v-10"/>
          <path d="M64 104 v10"/>
          <path d="M34 64 h-10"/>
          <path d="M104 64 h10"/>
          <path d="M44 44 l-7 -7"/>
          <path d="M91 91 l7 7"/>
          <path d="M44 84 l-7 7"/>
          <path d="M91 37 l7 -7"/>
        </g>
      </g>
      <path d="M28 90c-2 2-2 5 0 7l3 3c2 2 5 2 7 0l30-30c4 2 9 1 12-2 4-4 4-10 0-14-3-3-8-4-12-2l-30 30z"
            fill="currentColor" style="color: var(--text); opacity:.9"/>
    </svg>

    <h1 id="maintitle">Hệ thống đang bảo trì</h1>
    <p>Hệ thống đang được nâng cấp để phục vụ bạn tốt hơn.</p>

    <!-- Hiển thị thời gian lấy từ LocalStorage -->
    <div>
      <span class="time-badge" id="lblMaintenanceTime">Quay lại lúc: Đang cập nhật...</span>
    </div>
    <span class="countdown-text" id="lblCountdownRemaining"></span>

    <!-- Nút kiểm tra & Vào lại ngay -->
    <div>
      <button class="btn" onclick="checkAndRedirect(true)" aria-label="Kiểm tra và vào lại">
        ↻ Thử vào lại
      </button>
    </div>

    <div class="tips" role="note">
      Hệ thống sẽ tự động chuyển hướng khi hoàn tất bảo trì.
    </div>
  </main>

  <script>
    const savedConfig = JSON.parse(localStorage.getItem("maintenanceConfig") || "{}");
    const targetUrl = savedConfig.targetUrl || "appliedmathematics.html";
    const endTime = savedConfig.endTime || 0;
    const textShow = savedConfig.textShow;

    const lblTime = document.getElementById("lblMaintenanceTime");
    const lblRemaining = document.getElementById("lblCountdownRemaining");

    // 1. Hiển thị thông báo mốc thời gian
    if (textShow) {
      lblTime.textContent = `Quay lại lúc: ${textShow}`;
    } else {
      lblTime.textContent = "Quay lại lúc: Vui lòng thử lại sau";
    }

    // 2. Hàm kiểm tra trạng thái và chuyển trang
    function checkAndRedirect(isManualClick = false) {
      const now = Date.now();
      
      if (!endTime || now >= endTime) {
        // Đã hết giờ bảo trì -> Xóa config và vào lại trang chủ
        localStorage.removeItem("maintenanceConfig");
        window.top.location.replace(targetUrl); // THÊM .top VÀO ĐÂY
      } else {
        // Chưa hết giờ mà người dùng bấm thử vào lại
        if (isManualClick) {
          const diff = Math.ceil((endTime - now) / 1000);
          const mins = Math.floor(diff / 60);
          const secs = diff % 60;
          alert(`Hệ thống vẫn đang bảo trì!\nCòn lại khoảng: ${mins} phút ${secs} giây nữa.`);
        }
      }
    }

    // 3. Đếm ngược tự động mỗi giây
    function updateCountdown() {
      const now = Date.now();
      if (!endTime) return;

      const diff = Math.floor((endTime - now) / 1000);

      if (diff <= 0) {
        lblRemaining.textContent = "Đang mở lại hệ thống...";
        checkAndRedirect(false);
      } else {
        const hours = Math.floor(diff / 3600);
        const mins = Math.floor((diff % 3600) / 60);
        const secs = diff % 60;
        
        let timeStr = "";
        if (hours > 0) timeStr += `${hours} giờ `;
        timeStr += `${mins} phút ${secs} giây`;
        
        lblRemaining.textContent = `(Tự động mở lại sau: ${timeStr})`;
      }
    }

    // Khởi chạy vòng lặp kiểm tra
    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
